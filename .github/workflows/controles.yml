name: Contrôles

# Les contrôles d'IozyTest, sur chaque push et chaque pull request. Avant la
# séparation des dépôts (2026-11-13), ils tournaient depuis le monorepo iozy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  controles:
    name: Contrôles IozyTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (typecheck, puis vite)
        run: npm run build
      - name: Tests serveur
        run: npm test
      - name: Tests unitaires
        run: npm run test:unit
